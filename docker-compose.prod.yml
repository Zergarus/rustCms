# Продакшен-пример: CMS и PostgreSQL. Секреты — в .env (не коммитить).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cms} -d ${POSTGRES_DB:-cms}"]
      interval: 5s
      retries: 10

  cms:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cms}
      BIND_ADDR: 0.0.0.0:3000
      CORS_ORIGINS: ${CORS_ORIGINS:?задайте CORS_ORIGINS — домен витрины}
      COOKIE_SECURE: "true"
      MAIL_SMTP_URL: ${MAIL_SMTP_URL:-}
      RUST_LOG: cms=info,tower_http=warn
    volumes:
      - upload:/app/upload
      - mail:/app/mail
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  upload:
  mail:
