map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https on;
}

map $http_x_forwarded_proto $redirect_to_https {
    default 1;
    https 0;
}

# CORS: эхо Origin только для самого домена и его поддоменов (напр. swagger.transopt.local).
# Пустая строка для прочих origin — тогда add_header не выводит заголовок вовсе.
map $http_origin $cors_allow_origin {
    default "";
    "~*^https?://([a-z0-9-]+\.)*transopt\.local$" $http_origin;
}
# Значение Allow-Credentials: "true" только для разрешённого origin, иначе пусто
# (заголовок не выводится). Так же gated, как и сам Allow-Origin.
map $cors_allow_origin $cors_allow_creds {
    default "";
    "~." "true";
}

server {
    listen 80 default_server;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_comp_level 7;
    gzip_types application/x-javascript application/javascript text/css;

    access_log /dev/stdout;
    error_log /dev/stderr notice;

    index index.php;

    if ($redirect_to_https) {
        return 308 https://$host$request_uri;
    }

    root /var/www/www;

    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 1024M;
    client_body_buffer_size 4M;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    #add_header Strict-Transport-Security "max-age=31536000; preload;";

    # CORS для кросс-доменных запросов с разрешённых origin (см. map $cors_allow_origin).
    # Наследуется локацией @php, поэтому попадает и в ответы API (/api/v1/*).
    # `always` — чтобы заголовки были и на ответах с ошибкой (4xx/5xx JSON).
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Allow-Credentials $cors_allow_creds always;
    add_header Vary Origin always;

    # if ($request_uri ~ ^([^\?]*)/index\.(html|php)) { return 308 $1/$is_args$args; }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }
    # Player options, disable no-sniff
    location = /bitrix/components/bitrix/player/mediaplayer/player {
        add_header Access-Control-Allow-Origin *;
    }

    location = /404.html {
        try_files $uri /bitrix/urlrewrite.php$is_args$args;
        access_log off;
    }

    # Intenal locations
    location ^~ /bitrix/modules {
        internal;
    }
    location ^~ /bitrix/local_cache {
        internal;
    }
    location ^~ /bitrix/stack_cache {
        internal;
    }
    location ^~ /bitrix/managed_cache {
        internal;
    }
    location ^~ /bitrix/php_interface {
        internal;
    }
    location ^~ /upload/support/not_image {
        internal;
    }

    # Static content
    location ^~ /bitrix/images {
        access_log off;
        expires 97d;
        error_page 404 /404.html;
        location ~ /\. {
            internal;
        }
    }
    location ^~ /bitrix/tmp {
        access_log off;
        expires 97d;
        error_page 404 /404.html;
        location ~ /\. {
            internal;
        }
    }
    # Disable access for other assets in cache location
    location ^~ /bitrix/cache {
        # Accept access for merged css and js
        location ~* ^/bitrix/cache/(css/.+\.css|js/.+\.js)$ {
            access_log off;
            expires 97d;
            error_page 404 /404.html;
        }
        location /bitrix/cache {
            internal;
        }
        location ~ /\. {
            internal;
        }
    }
    location ^~ /upload/ {
        location ~ /\. {
            internal;
        }
        location ~* ^/upload/1c_[^/]+/ {
            internal;
        }
        location ~* [^/]\.(jpe?g|png|tiff|gif|webp|xml|yml|ogg|ogv|svgz?|eot|otf|woff2?|mp4|ttf|rss|atom|ico|zip|t?gz|rar|bz2|doc|xls|exe|ppt|tar|midi?|wav|rtf|pdf|txt|js|css|bmp|pnm|pbm|ppm)$ {
            access_log off;
            expires 97d;
            error_page 404 /404.html;
        }
        location ~ [^/]\.php$ {
            internal;
        }
    }
    # Preflight (OPTIONS) для API отдаём прямо из nginx, не доходя до PHP/D7-роутинга
    # (иначе Bitrix отвечает 404 без CORS-заголовков). Обычные методы идут в routing_index.php;
    # их CORS-заголовки приходят из server-level add_header через @php.
    location ^~ /api/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            add_header Access-Control-Allow-Credentials $cors_allow_creds always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, X-Bitrix-Csrf-Token, X-Bitrix-Sessid, Authorization, X-Requested-With" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            add_header Content-Length 0;
            return 204;
        }
        try_files $uri $uri/ /bitrix/routing_index.php$is_args$args;
    }

    location / {
        try_files $uri $uri/ /bitrix/routing_index.php$is_args$args;
        location ~ ^/bitrix/tools/(vote/uf|html_editor_action)\.php$ {
            if ($request_method = POST) { return 404; }
            try_files return @php;
        }
        location ~ ^/(?:[^/]+/)*(templates|themes)/(?:[^/]+/)*\.[^/]+(?:/.*)?$ {
            access_log off;
            log_not_found off;
            location ~ \.php$ {
                try_files /f5debce384416c95c84c8122354ed680.htm @php;
            }
            location ~* ^.+\.(jpe?g|png|tiff|gif|webp|xml|html|yml|ogg|ogv|svg|svgz|eot|otf|woff|woff2|mp4|ttf|rss|atom|ico|zip|tgz|gz|rar|bz2|doc|xls|exe|ppt|tar|mid|midi|wav|rtf|pdf|txt|js|css|bmp|pnm|pbm|ppm)$ {
                access_log off;
                expires 97d;
                error_page 404 /404.html;
            }
        }
        location ~ /\. {
            internal;
        }
        # Accept access for merged css and js
        location ~* ^/bitrix/cache/(css/.+\.css|js/.+\.js)$ {
            access_log off;
            expires 97d;
            error_page 404 /404.html;
        }
        location ~ \.php$ {
            try_files /f5debce384416c95c84c8122354ed680.htm @php;
        }
        location ~* ^.+\.(jpe?g|png|tiff|gif|webp|xml|yml|ogg|ogv|svg|svgz|eot|otf|woff|woff2|mp4|ttf|rss|atom|ico|zip|tgz|gz|rar|bz2|doc|xls|exe|ppt|tar|mid|midi|wav|rtf|pdf|txt|js|css|bmp|pnm|pbm|ppm)$ {
            access_log off;
            expires 97d;
            error_page 404 /404.html;
        }
        # Cache location: composite and general site
        location ~* @.*\.html$ { internal; }
    }
    location @php {
        try_files $uri /bitrix/urlrewrite.php$is_args$args;
        include fastcgi_params;
        # variable forces DNS re-resolve after php-fpm container restart
        set $php_fpm_upstream bench-php-fpm:9000;
        fastcgi_pass $php_fpm_upstream;
        fastcgi_param HTTP_REFERER $http_referer if_not_empty;
        fastcgi_param HTTP_X_REQUESTED_WITH $http_x_requested_with if_not_empty;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $fastcgi_https;
    }
}
