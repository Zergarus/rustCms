{% extends "base.html" %}
{% block title %}Модуль выключен{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Модуль „Магазин“ выключен</h1>
</div>
<div class="card">
  <p>Разделы магазина недоступны, пока модуль не включён.</p>

  {% endif %}
</div>
{% endblock %}
